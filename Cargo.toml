[package]
name = "zellij-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.57", features = ["derive"] }
axum = "0.8.8"
log = "0.4.0"
schemars = { version = "1.2.0", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7.18"
tracing-subscriber = { version = "0.3.22", features = [
  "env-filter",
  "std",
  "fmt",
] }
tracing = "0.1.44"
zellij-utils = "0.43.1"
interprocess = "1.2.1"
# Interactivate line, options future
rustyline = "17.0.2"
dirs = "6.0.0"
colored = "3.1.1"

[dependencies.rmcp]
version = "0.14.0"
features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "reqwest",
    "schemars"
]
